backend:
  name: github
  repo: avemath/plvinc
  branch: main
  base_url: https://sveltia-cms-auth.averymatherne.workers.dev

media_folder: public/images/uploads
public_folder: /images/uploads

site_url: https://plvinc.com
locale: en

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ──────────────────────────────────────────────────────────────
  # SITE SETTINGS
  # ──────────────────────────────────────────────────────────────
  - name: settings
    label: "⚙️ Site Settings"
    delete: false
    files:
      - name: global
        label: "Global Settings"
        file: src/data/settings.json
        format: json
        fields:
          - label: "Professional Name"
            name: professional_name
            widget: string
            hint: "Your full name and credentials as shown in the browser tab and footer (e.g., Jane Smith, CPL)."

          - label: "Tagline"
            name: tagline
            widget: string
            hint: "A one-line description shown below your name in the footer (e.g., Certified Professional Landman)."

          - label: "Logo"
            name: logo
            widget: image
            required: false
            hint: "The main logo, shown in the header on desktop. If left blank, your business name appears as text instead."

          - label: "Logo (narrow)"
            name: logo_small
            widget: image
            required: false
            hint: "A narrower version of the logo, used in the header on phones where the main one is too tall. Leave blank to use the main logo everywhere."

          - label: "Logo (light, for dark backgrounds)"
            name: logo_small_light
            widget: image
            required: false
            hint: "A white version of the narrow logo, used in the dark footer. Leave blank to show your business name as text there instead."

          - label: "Phone Number"
            name: phone
            widget: string
            hint: "Your business phone number (e.g., (555) 555-5555). Shown in the navigation and contact page."

          - label: "Email Address"
            name: email
            widget: string
            hint: "The email address shown publicly on the site. This should be your business address at your own domain, not a personal one."

          - label: "City"
            name: city
            widget: string
            required: false
            hint: "The city you are based in. Shown in the footer and on the Contact page, and used by search engines. Both City and State must be filled in before either appears."

          - label: "State"
            name: state
            widget: string
            required: false
            hint: "The state you are based in, for example Louisiana. Shown alongside City."

          - label: "LinkedIn URL"
            name: linkedin_url
            widget: string
            required: false
            hint: "The full web address of the company LinkedIn page. Leave blank to hide the LinkedIn link everywhere."

          - label: "Service Area Summary"
            name: service_area_summary
            widget: string
            hint: "The region line in the footer. Keep it in step with the basins on the home page
              coverage map, which is where these names come from."

          - label: "Footer Name / Company"
            name: footer_name
            widget: string
            hint: "Name or company shown in the copyright line at the bottom of every page."

          - label: "Default Page Title"
            name: seo_title
            widget: string
            hint: "Browser tab title and search result headline. Aim for under 60 characters."

          - label: "Default Meta Description"
            name: seo_description
            widget: text
            hint: "Search result description shown under your site title. Aim for under 155 characters."

          - label: "Default Share Image"
            name: seo_share_image
            widget: image
            required: false
            hint: "Image shown when someone shares your site link on social media. Recommended size: 1200 × 630 pixels."

          - label: "Contact Form Access Key"
            name: web3forms_key
            widget: string
            hint: "Your Web3Forms access key — required for the contact form to send emails. Get a free key at web3forms.com, then paste it here."

  # ──────────────────────────────────────────────────────────────
  # PAGES
  # ──────────────────────────────────────────────────────────────
  - name: pages
    label: "📄 Pages"
    delete: false
    files:

      - name: home
        label: "Home Page"
        file: src/data/pages/home.json
        format: json
        fields:
          - label: "Hero Headline"
            name: hero_headline
            widget: string
            hint: "The large headline visitors see first. Clear and direct works best."

          - label: "Hero Subheadline"
            name: hero_subheadline
            widget: string
            hint: "One or two sentences below the headline. Describes who you serve and where."

          - label: "Hero Background Image"
            name: hero_image
            widget: image
            required: false
            hint: "Optional background photo for the hero section. Landscape format works best. Leave blank for a solid green background."

          - label: "Hero Button Text"
            name: hero_cta_text
            widget: string
            hint: "Text on the call-to-action button in the hero (e.g., Discuss Your Project)."

          - label: "Value Paragraph"
            name: value_paragraph
            widget: markdown
            hint: "A paragraph below the hero that explains your value and what you offer. Plain writing is best — skip the sales language."

          - label: "Coverage Section Label"
            name: regions_label
            widget: string
            hint: "Small uppercase label above the coverage headline (e.g., Coverage)."

          - label: "Coverage Headline"
            name: regions_headline
            widget: string
            hint: "Headline for the coverage map section (e.g., Where We Work)."

          - label: "Coverage Intro"
            name: regions_note
            widget: text
            hint: "Sentence below the headline explaining how to use the map. This is also where you say you take work nationwide."

          - label: "Map Legend — Worked"
            name: regions_legend_worked
            widget: string
            hint: "Label for shaded states on the map (e.g., Project experience)."

          - label: "Map Legend — Available"
            name: regions_legend_available
            widget: string
            hint: "Label for unshaded states on the map (e.g., Available nationwide)."

          - label: "Map Caption"
            name: regions_hint
            widget: string
            hint: "Caption under the map, shown until a state is hovered. Avoid counts here — they date quickly and make the coverage look smaller than it is."

          - label: "Basins & Regions"
            name: regions
            widget: list
            summary: "{{name}}"
            hint: "Each entry becomes a tab beside the map. Selecting it highlights that basin's states. Add as many as you like — no count appears anywhere on the site, so this list can grow as your coverage does."
            fields:
              - label: "Basin / Region Name"
                name: name
                widget: string
                hint: "e.g., Appalachian Basin"

              - label: "ID"
                name: id
                widget: string
                pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers, and hyphens only."]
                hint: "A short lowercase name used internally to link the tab to the map (e.g., appalachian). No spaces or capitals."

              - label: "States"
                name: states
                widget: select
                multiple: true
                hint: "The states this basin covers. These are what light up on the map when the tab is selected. Pick from the list so the map always matches."
                options:
                  - "Alabama"
                  - "Arizona"
                  - "Arkansas"
                  - "California"
                  - "Colorado"
                  - "Connecticut"
                  - "Delaware"
                  - "Florida"
                  - "Georgia"
                  - "Idaho"
                  - "Illinois"
                  - "Indiana"
                  - "Iowa"
                  - "Kansas"
                  - "Kentucky"
                  - "Louisiana"
                  - "Maine"
                  - "Maryland"
                  - "Massachusetts"
                  - "Michigan"
                  - "Minnesota"
                  - "Mississippi"
                  - "Missouri"
                  - "Montana"
                  - "Nebraska"
                  - "Nevada"
                  - "New Hampshire"
                  - "New Jersey"
                  - "New Mexico"
                  - "New York"
                  - "North Carolina"
                  - "North Dakota"
                  - "Ohio"
                  - "Oklahoma"
                  - "Oregon"
                  - "Pennsylvania"
                  - "Rhode Island"
                  - "South Carolina"
                  - "South Dakota"
                  - "Tennessee"
                  - "Texas"
                  - "Utah"
                  - "Vermont"
                  - "Virginia"
                  - "Washington"
                  - "West Virginia"
                  - "Wisconsin"
                  - "Wyoming"

              - label: "Summary"
                name: summary
                widget: text
                hint: "A short paragraph about working in this basin — what makes the land work here distinctive."

              - label: "Plays & Formations"
                name: plays
                widget: list
                summary: "{{name}}"
                hint: "The plays worked in this basin. Each shows with its definition in the panel beside the map."
                fields:
                  - label: "Play / Formation Name"
                    name: name
                    widget: string
                    hint: "e.g., Marcellus Shale"
                  - label: "One-Line Definition"
                    name: definition
                    widget: text
                    hint: "A plain-language sentence explaining what this play is and where it sits. Written for clients who are not landmen."

          - label: "Services Section Label"
            name: services_label
            widget: string
            hint: "Small uppercase label above the services headline (e.g., What We Do)."

          - label: "Services Section Headline"
            name: services_headline
            widget: string
            hint: "Headline for the services section on the home page (e.g., Land Services)."

          - label: "Services Section Intro"
            name: services_intro
            widget: text
            hint: "A sentence or two below the services headline, before the service cards."

          - label: "Closing Call to Action"
            name: cta
            widget: object
            hint: "The band at the bottom of the home page. Each page has its own — vary the wording so they do not all read the same."
            fields:
              - label: "Headline"
                name: headline
                widget: string
              - label: "Text"
                name: text
                widget: text
                required: false
              - label: "Button Text"
                name: button
                widget: string

      - name: about
        label: "About Page"
        file: src/data/pages/about.json
        format: json
        fields:
          - label: "Page Subtitle"
            name: page_subtitle
            widget: text
            hint: "The line under the page title in the green band at the top of the About page."

          - label: "Search Description"
            name: meta_description
            widget: text
            hint: "The sentence shown under this page's title in Google results. Around 155 characters."

          - label: "Headshot / Professional Photo"
            name: headshot
            widget: image
            required: false
            hint: "Your professional photo. Square or portrait orientation works best. Leave blank to hide the photo."

          - label: "Bio"
            name: bio
            widget: markdown
            hint: "Your full professional biography. This is the main text on the About page."

          - label: "Approach / Philosophy Headline"
            name: approach_headline
            widget: string
            hint: "Headline for your working approach section (e.g., How I Work)."

          - label: "Approach / Philosophy"
            name: approach
            widget: markdown
            hint: "Describe your working philosophy, approach to projects, and what clients can expect."

          - label: "Credentials & Certifications"
            name: credentials
            widget: list
            hint: "Professional licenses, certifications, and designations. Your CPL should appear first. Add others as needed."
            fields:
              - label: "Credential Name"
                name: name
                widget: string
                hint: "e.g., Certified Professional Landman (CPL)"
              - label: "Issuing Organization"
                name: issuer
                widget: string
                hint: "e.g., American Association of Professional Landmen (AAPL)"
              - label: "Year Earned"
                name: year
                widget: string
                hint: "e.g., 2003"

          - label: "Affiliations & Memberships"
            name: affiliations
            widget: list
            hint: "Professional associations and industry memberships."
            fields:
              - label: "Organization Name"
                name: name
                widget: string
              - label: "Website (optional)"
                name: url
                widget: string
                required: false
                hint: "e.g., https://www.landman.org — leave blank if you do not want a link."

          - label: "Closing Call to Action"
            name: cta
            widget: object
            hint: "The band at the bottom of the About page."
            fields:
              - label: "Headline"
                name: headline
                widget: string
              - label: "Text"
                name: text
                widget: text
                required: false
              - label: "Button Text"
                name: button
                widget: string

      - name: experience
        label: "Experience Page"
        file: src/data/pages/experience.json
        format: json
        fields:
          - label: "Page Subtitle"
            name: page_subtitle
            widget: text
            hint: "The line under the page title in the green band at the top of the Experience page."

          - label: "Search Description"
            name: meta_description
            widget: text
            hint: "The sentence shown under this page's title in Google results. Around 155 characters."

          - label: "Introduction"
            name: intro
            widget: markdown
            hint: "Opening paragraph(s) for the Experience page. Describe your regional background and depth of experience."

          - label: "Where We've Worked — Note"
            name: states_note
            widget: text
            hint: "Sentence under the heading. Use it to make clear the list is past experience, not a limit on where you take work."

          - label: "Where We've Worked"
            name: states_served
            widget: list
            hint: "States and basins where you have active experience. Each entry appears as a highlighted card. No count is shown anywhere, so this list can grow freely."
            fields:
              - label: "State"
                name: state
                widget: string
                hint: "e.g., Texas"
              - label: "Basins / Plays / Notes"
                name: note
                widget: string
                hint: "e.g., Permian Basin, Eagle Ford, Haynesville"

          - label: "Project Types"
            name: project_types
            widget: list
            hint: "Types of projects you have completed. Shown as a bulleted list."
            fields:
              - label: "Project Type"
                name: label
                widget: string
                hint: "e.g., Greenfield leasing programs"

          - label: "Testimonials"
            name: testimonials
            widget: list
            required: false
            hint: "Optional client testimonials. Leave this empty if you prefer not to show them — the section will be hidden automatically."
            fields:
              - label: "Quote"
                name: quote
                widget: text
                hint: "The client's words. Do not include quotation marks — they are added automatically."
              - label: "Client Name"
                name: attribution_name
                widget: string
                hint: "e.g., Jane Doe"
              - label: "Client Title / Company"
                name: attribution_title
                widget: string
                hint: "e.g., Land Manager, XYZ Energy"

          - label: "Where We've Worked — Label"
            name: states_label
            widget: string
            hint: "Small uppercase label above the states section (e.g., Track Record)."

          - label: "Where We've Worked — Headline"
            name: states_headline
            widget: string

          - label: "Project Types — Label"
            name: project_types_label
            widget: string
            hint: "Small uppercase label above the project types section (e.g., Scope)."

          - label: "Project Types — Headline"
            name: project_types_headline
            widget: string

          - label: "Testimonials — Label"
            name: testimonials_label
            widget: string
            hint: "Only shown when at least one testimonial is added below."

          - label: "Testimonials — Headline"
            name: testimonials_headline
            widget: string

          - label: "Closing Call to Action"
            name: cta
            widget: object
            hint: "The band at the bottom of the Experience page."
            fields:
              - label: "Headline"
                name: headline
                widget: string
              - label: "Text"
                name: text
                widget: text
                required: false
              - label: "Button Text"
                name: button
                widget: string

      - name: contact
        label: "Contact Page"
        file: src/data/pages/contact.json
        format: json
        fields:
          - label: "Search Description"
            name: meta_description
            widget: text
            hint: "The sentence shown under this page's title in Google results. Around 155 characters."

          - label: "Contact Details Headline"
            name: details_headline
            widget: string
            hint: "Heading above your phone, email and service area (e.g., Reach Out Directly)."

          - label: "Intro Text"
            name: intro
            widget: string
            hint: "Short invitation text at the top of the contact page."

          - label: "Phone"
            name: phone
            widget: string
            hint: "Phone number shown on the contact page."

          - label: "Email"
            name: email
            widget: string
            hint: "Email address shown on the contact page."

          - label: "Service Area Note"
            name: service_area_note
            widget: string
            hint: "Brief note about geographic coverage shown on the contact page."

          - label: "Mailing Address (optional)"
            name: mailing_address
            widget: text
            required: false
            hint: "Optional mailing address. Leave blank to omit from the page."

          - label: "Form Headline"
            name: form_headline
            widget: string
            hint: "The heading above the contact form."

          - label: "Form Intro"
            name: form_intro
            widget: text
            required: false
            hint: "A short line under the form heading. Leave blank to hide it."

          - label: "Form Field Labels"
            name: form_labels
            widget: object
            hint: "The wording shown beside each box on the form. Changing these does not change what the form collects."
            fields:
              - label: "Phone field"
                name: phone
                widget: string
              - label: "I am a field"
                name: inquirer_type
                widget: string
              - label: "State field"
                name: state
                widget: string
              - label: "County field"
                name: county
                widget: string
              - label: "Service field"
                name: service
                widget: string
              - label: "Timeline field"
                name: timeline
                widget: string

          - label: "\"I am a\" Options"
            name: inquirer_types
            widget: list
            summary: "{{label}}"
            hint: "The choices in the \"I am a\" dropdown. Add, remove or reorder them. Empty this list to remove the question from the form."
            fields:
              - label: "Option"
                name: label
                widget: string

          - label: "Timeline Options"
            name: timelines
            widget: list
            summary: "{{label}}"
            hint: "The choices in the Timeline dropdown. Empty this list to remove the question from the form."
            fields:
              - label: "Option"
                name: label
                widget: string

      - name: mineral_owners
        label: "Mineral Owners Page"
        file: src/data/pages/mineral-owners.json
        format: json
        fields:
          - label: "Page Subtitle"
            name: page_subtitle
            widget: text
            hint: "The line under the page title in the green band at the top."

          - label: "Search Description"
            name: meta_description
            widget: text
            hint: "The sentence shown under this page's title in Google results. Around 155 characters."

          - label: "Introduction"
            name: intro
            widget: markdown
            hint: "The opening paragraphs. Write for someone who has never dealt with a landman before."

          - label: "Services Section Label"
            name: services_label
            widget: string

          - label: "Services Section Headline"
            name: services_headline
            widget: string

          - label: "What You Can Bring to Us"
            name: services
            widget: list
            summary: "{{title}}"
            hint: "Each entry becomes a card. Empty this list to hide the whole section."
            fields:
              - label: "Title"
                name: title
                widget: string
              - label: "Description"
                name: description
                widget: text

          - label: "FAQ Section Label"
            name: faq_label
            widget: string

          - label: "FAQ Section Headline"
            name: faq_headline
            widget: string

          - label: "Questions and Answers"
            name: faq
            widget: list
            summary: "{{question}}"
            hint: "These also tell Google what this page answers, so write the question the way someone would actually ask it. Empty this list to hide the section."
            fields:
              - label: "Question"
                name: question
                widget: string
              - label: "Answer"
                name: answer
                widget: text

          - label: "Legal Note"
            name: disclaimer
            widget: text
            required: false
            hint: "The note at the bottom about not giving legal advice. Leave blank to hide it."

          - label: "Closing Call to Action"
            name: cta
            widget: object
            hint: "The band at the bottom of this page."
            fields:
              - label: "Headline"
                name: headline
                widget: string
              - label: "Text"
                name: text
                widget: text
                required: false
              - label: "Button Text"
                name: button
                widget: string

      - name: services_page
        label: "Services Page"
        file: src/data/pages/services.json
        format: json
        fields:
          - label: "Page Subtitle"
            name: page_subtitle
            widget: text
            hint: "The line under the page title in the green band at the top of the Services page."

          - label: "Search Description"
            name: meta_description
            widget: text
            hint: "The sentence shown under this page's title in Google results. Around 155 characters."

          - label: "Closing Call to Action"
            name: cta
            widget: object
            hint: "The band at the bottom of the Services page."
            fields:
              - label: "Headline"
                name: headline
                widget: string
              - label: "Text"
                name: text
                widget: text
                required: false
              - label: "Button Text"
                name: button
                widget: string

      - name: people_page
        label: "Team Page"
        file: src/data/pages/people.json
        format: json
        fields:
          - label: "Page Subtitle"
            name: page_subtitle
            widget: text
            hint: "The line under the page title in the green band at the top of the Team page."

          - label: "Search Description"
            name: meta_description
            widget: text
            hint: "The sentence shown under this page's title in Google results. Around 155 characters."

          - label: "Closing Call to Action"
            name: cta
            widget: object
            hint: "The band at the bottom of the Team page."
            fields:
              - label: "Headline"
                name: headline
                widget: string
              - label: "Text"
                name: text
                widget: text
                required: false
              - label: "Button Text"
                name: button
                widget: string


  # ──────────────────────────────────────────────────────────────
  # SERVICES
  # ──────────────────────────────────────────────────────────────
  - name: services
    label: "🛠️ Services"
    label_singular: "Service"
    folder: src/content/services
    create: true
    slug: "{{slug}}"
    format: frontmatter
    extension: md
    summary: "{{sort_order}}. {{title}}"
    fields:
      - label: "Service Title"
        name: title
        widget: string
        hint: "The name of this service as shown on the website."

      - label: "Card Description"
        name: card_description
        widget: string
        hint: "Short description shown on the Services overview page — 1 to 2 sentences, ideally under 160 characters."

      - label: "Full Description"
        name: body
        widget: markdown
        hint: "Detailed description shown on this service's individual page. Bullet lists work well here."

      - label: "Icon / Symbol"
        name: icon
        widget: string
        required: false
        hint: "Optional emoji shown next to the service title (e.g., ⚖️ or 🔍). Leave blank for none."

      - label: "Display Order"
        name: sort_order
        widget: number
        default: 0
        value_type: int
        hint: "Controls the order services appear. Lower numbers come first (1, 2, 3...)."

  # ──────────────────────────────────────────────────────────────
  # PEOPLE / TEAM
  # ──────────────────────────────────────────────────────────────
  - name: people
    label: "👤 Team / People"
    label_singular: "Person"
    folder: src/content/people
    create: true
    slug: "{{name | slugify}}"
    format: frontmatter
    extension: md
    summary: "{{name}}{{role | ternary(' — ', '')}}{{role}}"
    description: "Add people here to create a Team page. The page and navigation link appear automatically once at least one person is added. Leave this section empty to hide the Team page entirely."
    fields:
      - label: "Full Name"
        name: name
        widget: string
        required: true
        hint: "This person's full name as it should appear on the website."

      - label: "Role / Title"
        name: role
        widget: string
        required: false
        hint: "Optional professional title (e.g., Senior Landman, Project Manager). Leave blank to omit."

      - label: "Photo"
        name: photo
        widget: image
        required: false
        hint: "Optional professional headshot. Square or portrait orientation works best. Leave blank to omit."

      - label: "Display Order"
        name: sort_order
        widget: number
        required: false
        default: 0
        value_type: int
        hint: "Order in which this person appears on the Team page. Lower numbers appear first."

      - label: "Bio"
        name: body
        widget: markdown
        required: true
        hint: "This person's professional biography."

      - label: "Work & Experience Details"
        name: experience_details
        widget: markdown
        required: false
        hint: "Optional section for additional work history, notable projects, or areas of expertise. Leave blank to omit."
