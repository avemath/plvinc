                widget: list
                fields:
                  - { label: "Label", name: label, widget: string }
                  - { label: "Value", name: value, widget: string }
              - label: "Tracts"
                name: tracts
                widget: list
                fields:
                  - { label: "Tract", name: tract, widget: string }
                  - { label: "Description", name: description, widget: text }
                  - { label: "Record title", name: record_title, widget: string }
                  - { label: "Gross acres", name: gross_acres, widget: string }
                  - { label: "Interest", name: interest, widget: string }
                  - { label: "Net acres", name: net_acres, widget: string }
              - label: "Tract Totals"
                name: tract_totals
                widget: object
                fields:
                  - { label: "Gross acres", name: gross_acres, widget: string }
                  - { label: "Net acres", name: net_acres, widget: string }
              - label: "Documents Heading"
                name: documents_headline
                widget: string
              - label: "Documents Included"
                name: documents
                widget: list
                hint: "Each one is drawn as a ticked box."
                field: { label: "Document", name: document, widget: string }
              - label: "Comments"
                name: comments
                widget: text
              - label: "Prepared By"
                name: prepared_by
                widget: string

              - label: "Reader's Notes"
                name: annotations
                widget: list
                required: false
                summary: "{{n}}. {{anchor}}"
                hint: "The notes shown beside this document. Anchor picks which part the note sits next to."
                fields:
                  - { label: "Number", name: n, widget: number, value_type: int }
                  - { label: "Sits Next To", name: anchor, widget: select, options: [{ label: "Net acres and total bonus", value: "terms" }, { label: "Comments", value: "comments" }], hint: "Which part of the document this note explains." }
                  - { label: "Note", name: text, widget: text }

          - label: "Supplemental Report"
            name: supplemental
            widget: object
            hint: "The fourth document, where the open quarter interest gets resolved. This is the one that shows hard work."
            fields:
              - { label: "Sheet Title", name: title, widget: string }
              - label: "Header Fields"
                name: fields
                widget: list
                fields:
                  - { label: "Label", name: label, widget: string }
                  - { label: "Value", name: value, widget: text }
              - { label: "Sources Heading", name: sources_headline, widget: string }
              - label: "Sources"
                name: sources
                widget: list
                field: { label: "Source", name: source, widget: text }
              - { label: "Tree Heading", name: tree_headline, widget: string }
              - label: "Heirship Tree"
                name: tree
                widget: object
                hint: "How the interest passed, three generations deep: the original owner, who inherited from them, and who inherited from those. Each person's interest should add up to their parent's."
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Interest", name: interest, widget: string }
                  - { label: "Detail", name: detail, widget: text }
                  - label: "Heirs"
                    name: children
                    widget: list
                    required: false
                    label_singular: "Heir"
                    summary: "{{name}} ({{interest}})"
                    fields:
                      - { label: "Name", name: name, widget: string }
                      - { label: "Interest", name: interest, widget: string }
                      - { label: "Detail", name: detail, widget: text }
                      - label: "Their Heirs"
                        name: children
                        widget: list
                        required: false
                        label_singular: "Heir"
                        summary: "{{name}} ({{interest}})"
                        fields:
                          - { label: "Name", name: name, widget: string }
                          - { label: "Interest", name: interest, widget: string }
                          - { label: "Detail", name: detail, widget: text }
              - { label: "Owners Heading", name: owners_headline, widget: string }
              - label: "Present Owners"
                name: owners
                widget: list
                hint: "Interests use six decimals and must add back to the parent interest."
                fields:
                  - { label: "Owner", name: name, widget: string }
                  - { label: "Interest", name: interest, widget: string }
                  - { label: "Net acres", name: net_acres, widget: string }
                  - { label: "Status", name: status, widget: string }
              - label: "Owner Totals"
                name: owners_totals
                widget: object
                fields:
                  - { label: "Interest", name: interest, widget: string }
                  - { label: "Net acres", name: net_acres, widget: string }
              - { label: "Curative Heading", name: curative_headline, widget: string }
              - label: "Curative Items"
                name: curative
                widget: list
                field: { label: "Item", name: item, widget: text }
              - { label: "Curative Note", name: curative_note, widget: string }
              - { label: "Prepared By", name: prepared_by, widget: string }
              - label: "Reader's Notes"
                name: annotations
                widget: list
                required: false
                summary: "{{n}}. {{anchor}}"
                fields:
                  - { label: "Number", name: n, widget: number, value_type: int }
                  - { label: "Sits Next To", name: anchor, widget: select, options: [{ label: "Sources", value: "sources" }, { label: "Ownership table", value: "owners" }, { label: "Curative list", value: "curative" }], hint: "Which part of the document this note explains." }
                  - { label: "Note", name: text, widget: text }

          - label: "What Makes a File Hard"
            name: hard_files
            widget: object
            required: false
            hint: "The section after the documents. Only list work the service pages already describe, and never describe a real past project."
            fields:
              - { label: "Headline", name: headline, widget: string }
              - { label: "Introduction", name: intro, widget: text }
              - label: "Items"
                name: items
                widget: list
                summary: "{{title}}"
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Text", name: text, widget: text }

          - label: "Closing Call to Action"
            name: cta
            widget: object
            hint: "The band at the bottom of this page."
            fields:
              - label: "Headline"
                name: headline
                widget: string
              - label: "Text"
                name: text
                widget: text
                required: false
              - label: "Button Text"
                name: button
                widget: string

      - name: privacy
        label: "Privacy Page"
        file: src/data/pages/privacy.json
        format: json
        fields:
          - label: "Page Heading"
            name: page_heading
            widget: string
            required: false
            hint: "The large heading in the green band at the top of the page. Blank shows \"Privacy\"."

          - label: "Page Subtitle"
            name: page_subtitle
            widget: text
            hint: "The line under the title at the top of the privacy page."

          - label: "Google Title (browser tab)"
            name: page_title
            widget: string
            maxlength: 40
            hint: "The browser tab title and the headline in Google results. \"| Petro Land Ventures\" is added to the end automatically, so this can be short. The counter stops at 40 characters."

          - label: "Google Description"
            name: meta_description
            widget: text
            maxlength: 160
            hint: "Search result description shown under the title. The counter stops at 160 characters, about what Google shows."

          - label: "Closing Call to Action"
            name: cta
            widget: object
            required: false
            hint: "The band at the bottom of the Privacy page. Leave the headline blank to hide it."
            fields:
              - { label: "Headline", name: headline, widget: string, required: false }
              - { label: "Text", name: text, widget: text, required: false }
              - { label: "Button Text", name: button, widget: string }

          - label: "Policy Text"
            name: body
            widget: markdown
            hint: "The policy itself. If you change how the contact form works or what analytics the site uses, update this to match, and change the Last updated date at the end."

      - name: not_found
        label: "Page Not Found (404)"
        file: src/data/pages/not-found.json
        format: json
        fields:
          - label: "Page Heading"
            name: page_heading
            widget: string
            required: false
            hint: "Shown when someone follows a broken or mistyped link. Blank shows \"Page Not Found\"."
          - label: "Line Under the Heading"
            name: page_subtitle
            widget: text
            required: false
          - label: "Line Above the Page Links"
            name: links_intro
            widget: string
            required: false
            hint: "The links themselves (Home, Services, Mineral Owners, Sample Work, Contact) use the Menu Wording from Site Settings."
          - label: "Phone Line"
            name: phone_line
            widget: string
            required: false
            hint: "Shown just before the phone number from Site Settings. Leave blank to leave the phone number off."

      - name: services_page
        label: "Services Page"
        file: src/data/pages/services.json
        format: json
        fields:
          - label: "Page Heading"
            name: page_heading
            widget: string
            required: false
            hint: "The large heading in the green band at the top of the page. Blank shows \"Services\"."

          - label: "Page Subtitle"
            name: page_subtitle
            widget: text
            hint: "The line under the page title in the green band at the top of the Services page."

          - label: "Service Card Link"
            name: card_link_label
            widget: string
            required: false
            hint: "The link at the foot of each service card, here and on the home page. Blank shows \"Learn more\"."

          - label: "Back Link on Each Service"
            name: back_link_label
            widget: string
            required: false
            hint: "The link back to this page from each individual service. Blank shows \"All Services\"."

          - label: "Google Title (browser tab)"
            name: page_title
            widget: string
            maxlength: 40
            hint: "The browser tab title and the headline in Google results. \"| Petro Land Ventures\" is added to the end automatically, so this can be short. The counter stops at 40 characters."

          - label: "Google Description"
            name: meta_description
            widget: text
            maxlength: 160
            hint: "The sentence shown under this page's title in Google results. The counter stops at 160 characters, about what Google shows."

          - label: "Sample Work Band"
            name: sample_feature
            widget: object
            required: false
            hint: "The band shown at the foot of every service page that has Show link to sample work turned on."
            fields:
              - { label: "Small Label", name: label, widget: string, required: false }
              - { label: "Headline", name: headline, widget: string, required: false }
              - { label: "Text", name: text, widget: text }
              - { label: "Button Text", name: button, widget: string }


          - label: "Closing Call to Action"
            name: cta
            widget: object
            hint: "The band at the bottom of the Services page. It is also used at the foot of every individual service, unless that service has its own closing wording."
            fields:
              - label: "Headline"
                name: headline
                widget: string
              - label: "Text"
                name: text
                widget: text
                required: false
              - label: "Button Text"
                name: button
                widget: string

  # ──────────────────────────────────────────────────────────────
  # SERVICES
  # ──────────────────────────────────────────────────────────────
  # One file per service in src/content/services. Field names match the schema
  # in src/content.config.ts: rename a label freely, but not a name.
  - name: services
    label: "🧭 Services"
    label_singular: "Service"
    folder: src/content/services
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{sort_order}}. {{title}}"
    sortable_fields: ["sort_order", "title"]
    fields:
      - label: "Service Title"
        name: title
        widget: string
        hint: "The name shown on the site, on the card and at the top of its own page."

      - label: "Card Description"
        name: card_description
        widget: text
        hint: "The short summary on the main Services page. One or two sentences."

      - label: "Icon / Symbol"
        name: icon
        widget: select
        required: false
        options: ["search", "pen", "list", "banknotes", "pin", "sun"]
        hint: "The line drawing shown beside the title. Pick from the list: search is a magnifying glass, pen is a document, list is a clipboard, banknotes is money, pin is a map pin, sun is renewables."

      - label: "Display Order"
        name: sort_order
        widget: number
        value_type: int
        default: 0
        hint: "Controls the order services appear in. Lower numbers come first."

      - label: "Show link to sample work"
        name: show_sample_link
        widget: boolean
        required: false
        default: false
        hint: "Adds a box at the foot of this service page pointing to the sample work page. Only worth turning on for services the samples actually illustrate."

      - label: "Closing Headline"
        name: cta_headline
        widget: string
        required: false
        hint: "The headline on the band at the foot of this service page. Leave blank to use the shared one from the Services page."

      - label: "Closing Text"
        name: cta_text
        widget: text
        required: false
        hint: "The sentence under that headline. Leave blank to use the shared one from the Services page."

      - label: "Closing Button Text"
        name: cta_button
        widget: string
        required: false
        hint: "The button on that band. Leave blank to use the shared one."

      - label: "Google Title (browser tab)"
        name: seo_title
        widget: string
        required: false
        maxlength: 40
        hint: "What Google shows as the headline for this service. \"| Petro Land Ventures\" is added automatically, so this can be short. Leave blank to use the service title."

      - label: "Google Description"
        name: seo_description
        widget: text
        required: false
        maxlength: 160
        hint: "What Google shows under the headline. Leave blank to fall back to the card description. The counter stops at 160 characters, about what Google shows."

      - label: "Full Description"
        name: body
        widget: markdown
        hint: "The detailed text on this service's own page. Lists and formatting are supported."

  # ──────────────────────────────────────────────────────────────
  # TEAM / PEOPLE
  # ──────────────────────────────────────────────────────────────
  # Rendered near the foot of the About page. Empty the folder and that section
  # disappears on its own.
  - name: people
    label: "👤 Team / People"
    label_singular: "Person"
    folder: src/content/people
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{sort_order}}. {{name}}"
    sortable_fields: ["sort_order", "name"]
    fields:
      - label: "Full Name"
        name: name
        widget: string
        hint: "Shown as the heading for this person, credentials included (e.g., Jane Smith, CPL)."

      - label: "Role / Title"
        name: role
        widget: string
        required: false
        hint: "The line under the name. Leave blank to hide it."

      - label: "LinkedIn URL"
        name: linkedin_url
        widget: string
        required: false
        pattern: ['^(https://(www\.)?linkedin\.com/.+)?$', "Paste the full address, starting with https://www.linkedin.com/"]
        hint: "The full web address of this person's LinkedIn profile. It shows on their About card, on the Contact page and in the footer. Leave blank to hide it."

      - label: "Credentials"
        name: credentials
        widget: list
        required: false
        summary: "{{fields.name}}"
        hint: "Licences and designations this person holds, such as the CPL. Each one shows on their card on the About page. Fill in the year and number when you have them; blank ones are left off."
        fields:
          - label: "Credential Name"
            name: name
            widget: string
            hint: "e.g., Certified Professional Landman (CPL)"
          - label: "Issuing Organization"
            name: issuer
            widget: string
            required: false
            hint: "e.g., American Association of Professional Landmen (AAPL)"
          - label: "Year Earned"
            name: year
            widget: string
            required: false
            pattern: ['^([0-9]{4})?$', "A four-digit year, e.g. 2003"]
            hint: "e.g., 2003"
          - label: "Certificate Number"
            name: number
            widget: string
            required: false
            hint: "The CPL number from the AAPL. Leave blank to leave it off."

      - label: "Photo"
        name: photo
        widget: image
        required: false
        hint: "A headshot, shown as a square. A square photo with the face centred and a little space above the head works best; a taller photo is fine too and gets trimmed from the bottom. Upload it under a new file name when replacing a photo, or the old one can linger for a day. Leave blank to show the bio without a picture."

      - label: "Display Order"
        name: sort_order
        widget: number
        required: false
        value_type: int
        default: 0
        hint: "Lower numbers appear first."

      - label: "Work & Experience Details"
        name: experience_details
        widget: markdown
        required: false
        hint: "Optional extra detail shown under the bio. Leave blank to hide it."

      - label: "Bio"
        name: body
        widget: markdown
        hint: "The paragraphs about this person."

  # ──────────────────────────────────────────────────────────────
  # INSIGHTS
  # ──────────────────────────────────────────────────────────────
  # Dormant while the folder is empty: no index, no detail pages, no nav link.
  # Publishing the first post brings all three into being.
  - name: insights
    label: "📝 Insights"
    label_singular: "Insight"
    folder: src/content/insights
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - label: "Title"
        name: title
        widget: string

      - label: "Date"
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        hint: "Controls the order. The newest appears first."

      - label: "Summary"
        name: summary
        widget: text
        hint: "One or two sentences shown in the list and used by search engines."

      - label: "Image"
        name: image
        widget: image
        required: false
        hint: "Optional, shown beside the summary in the list."

      - label: "Body"
        name: body
        widget: markdown
        hint: "The article itself."
