backend:
  name: github
  repo: avemath/plvinc
  branch: main
  base_url: https://sveltia-cms-auth.averymatherne.workers.dev

media_folder: public/images/uploads
public_folder: /images/uploads

# Uploads are resized and converted in the browser before they are committed, so a photo
# straight off a phone lands at a sensible size without anyone having to shrink it first.
# Filenames are cleaned up too, which matters because /images/ is cached for a day and a
# replacement photo has to arrive under a new name to show up straight away.
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

site_url: https://plvinc.com
locale: en

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ──────────────────────────────────────────────────────────────
  # SITE SETTINGS
  # ──────────────────────────────────────────────────────────────
  - name: settings
    label: "⚙️ Site Settings"
    delete: false
    files:
      - name: global
        label: "Global Settings"
        file: src/data/settings.json
        format: json
        fields:
          - label: "Professional Name"
            name: professional_name
            widget: string
            hint: "Your full name and credentials as shown in the browser tab and footer (e.g., Jane Smith, CPL)."

          - label: "Registered Business Name"
            name: legal_name
            widget: string
            required: false
            hint: "The company's full registered name (e.g., Petro Land Ventures, Inc.). Shown large at the top of the home page and given to search engines. Leave blank to use the Professional Name there instead."

          - label: "Tagline"
            name: tagline
            widget: string
            hint: "A one-line description shown below your name in the footer (e.g., Certified Professional Landman)."

          - label: "Logo"
            name: logo
            widget: image
            required: false
            hint: "The main logo, shown in the header on desktop. If left blank, your business name appears as text instead."

          - label: "Logo (narrow)"
            name: logo_small
            widget: image
            required: false
            hint: "A narrower version of the logo, used in the header on phones where the main one is too tall. Leave blank to use the main logo everywhere."

          - label: "Logo (light, for dark backgrounds)"
            name: logo_small_light
            widget: image
            required: false
            hint: "A white version of the narrow logo, used in the dark footer. Leave blank to show your business name as text there instead."

          - label: "Phone Number"
            name: phone
            widget: string
            pattern: ['^[0-9()+.\- ]{7,}$', "Numbers, spaces, brackets and dashes only, e.g. (555) 555-5555"]
            hint: "Your business phone number (e.g., (555) 555-5555). Used everywhere the site shows a phone number: the top of every page, the phone bar on mobile, the Contact page, the footer and the call buttons."

          - label: "Email Address"
            name: email
            widget: string
            pattern: ['^[^\s@]+@[^\s@]+\.[^\s@]+$', "This does not look like an email address"]
            hint: "The email address shown publicly on the site: the Contact page, the footer and the privacy policy. This should be your business address at your own domain, not a personal one."

          - label: "Based In"
            name: based_in
            widget: string
            required: false
            hint: "Where you are based, as visitors should read it. A region is fine, for example Central Pennsylvania. Shown in the footer and on the Contact page. Leave blank to hide it."

          - label: "City"
            name: city
            widget: string
            required: false
            hint: "Mainly used to tell search engines where you are. It is only shown on the page (with State) if Based In above is left blank."

          - label: "State"
            name: state
            widget: string
            required: false
            hint: "The state you are based in, for example Pennsylvania. Used to tell search engines where you are."

          - label: "LinkedIn URL"
            name: linkedin_url
            widget: string
            required: false
            pattern: ['^(https://(www\.)?linkedin\.com/.+)?$', "Paste the full address, starting with https://www.linkedin.com/"]
            hint: "The company LinkedIn page, if there is one. Personal profiles go on each person under Team / People. Leave blank to hide it."

          - label: "Service Area Summary"
            name: service_area_summary
            widget: string
            hint: "The region line in the footer, with the regions separated by a middle dot ( · ), e.g. Appalachian · Gulf Coast. The dots matter: search engines are given each region separately. Keep it in step with the home page coverage map."

          - label: "Footer Scope Line"
            name: footer_scope_line
            widget: text
            required: false
            hint: "One line at the foot of every page saying what the work covers. Leave blank to hide it."

          - label: "Footer Name / Company"
            name: footer_name
            widget: string
            hint: "Name or company shown in the copyright line at the bottom of every page."

          - label: "Menu Wording"
            name: nav_labels
            widget: object
            collapsed: true
            hint: "What each page is called in the menu at the top and in the footer. Only the wording changes; the pages themselves stay where they are. A blank box keeps the original wording."
            fields:
              - { label: "Home", name: home, widget: string, required: false }
              - { label: "About", name: about, widget: string, required: false }
              - { label: "Services", name: services, widget: string, required: false }
              - { label: "Mineral Owners", name: mineral_owners, widget: string, required: false }
              - { label: "Experience", name: experience, widget: string, required: false }
              - { label: "Sample Work", name: sample_work, widget: string, required: false }
              - { label: "Insights", name: insights, widget: string, required: false, hint: "Only shows once there is at least one Insight." }
              - { label: "Contact", name: contact, widget: string, required: false }

          - label: "Footer Wording"
            name: footer_labels
            widget: object
            collapsed: true
            hint: "The small headings and links in the dark footer at the bottom of every page. A blank box keeps the original wording."
            fields:
              - { label: "Contact column heading", name: contact_heading, widget: string, required: false }
              - { label: "Menu column heading", name: navigation_heading, widget: string, required: false }
              - { label: "Words after the copyright name", name: rights, widget: string, required: false, hint: "e.g. All rights reserved." }
              - { label: "Privacy link", name: privacy_link, widget: string, required: false }

          - label: "Phone Bar Wording (mobile)"
            name: mobile_bar_labels
            widget: object
            collapsed: true
            hint: "The two buttons pinned to the bottom of the screen on phones. A blank box keeps the original wording."
            fields:
              - { label: "Call button", name: call, widget: string, required: false }
              - { label: "Note button", name: note, widget: string, required: false, hint: "Opens the Contact page." }

          - label: "Home Page Google Title (browser tab)"
            name: seo_title
            widget: string
            maxlength: 60
            hint: "The home page's browser tab title and Google headline, business name included. The counter stops at 60 characters."

          - label: "Home Page Google Description"
            name: seo_description
            widget: text
            maxlength: 160
            hint: "Search result description shown under your site title. The counter stops at 160 characters, about what Google shows."

          - label: "Default Share Image"
            name: seo_share_image
            widget: image
            required: false
            hint: "Image shown when someone shares your site link on social media. Recommended size: 1200 × 630 pixels."

          - label: "Contact Form Access Key"
            name: web3forms_key
            widget: string
            hint: "Where contact form submissions are delivered. The key decides the
              destination, not the Email Address field above, so changing your email does not
              move the form. To redirect it, get a new free key at web3forms.com using the
              address you want the enquiries to reach, then paste that key here."

  # ──────────────────────────────────────────────────────────────
  # PAGES
  # ──────────────────────────────────────────────────────────────
  - name: pages
    label: "📄 Pages"
    delete: false
    files:

      - name: home
        label: "Home Page"
        file: src/data/pages/home.json
        format: json
        fields:
          - label: "Hero Headline"
            name: hero_headline
            widget: string
            hint: "The large headline visitors see first. Clear and direct works best."

          - label: "Hero Subheadline"
            name: hero_subheadline
            widget: string
            hint: "One or two sentences below the headline. Describes who you serve and where."

          - label: "Hero Background Image"
            name: hero_image
            widget: image
            required: false
            hint: "Optional background photo for the hero section. Landscape format works best, with the right-hand side carrying the subject. The headline sits over the left. A dark green wash is laid over whatever you upload so the text stays readable. The current photo was also softened (blurred) before upload; a sharp, busy photo will compete with the headline, so a calm one works best. Leave blank for a solid green background."

          - label: "Hero Button Text"
            name: hero_cta_text
            widget: string
            hint: "Text on the call-to-action button in the hero (e.g., Discuss Your Project)."

          - label: "Hero Button Link"
            name: hero_cta_href
            widget: select
            options:
              - { label: "Mineral Owners page", value: "/mineral-owners" }
              - { label: "Contact page", value: "/contact" }
              - { label: "Services page", value: "/services" }
              - { label: "About page", value: "/about" }
              - { label: "Experience page", value: "/experience" }
              - { label: "Sample Work page", value: "/sample-work" }
            required: false
            hint: "Where the first hero button goes. Defaults to the Mineral Owners page."

          - label: "Second Hero Button"
            name: hero_secondary_cta_text
            widget: string
            required: false
            hint: "The second path in the hero, for companies. Leave blank to show only one button."

          - label: "Second Hero Button Link"
            name: hero_secondary_cta_href
            widget: select
            options:
              - { label: "Mineral Owners page", value: "/mineral-owners" }
              - { label: "Contact page", value: "/contact" }
              - { label: "Services page", value: "/services" }
              - { label: "About page", value: "/about" }
              - { label: "Experience page", value: "/experience" }
              - { label: "Sample Work page", value: "/sample-work" }
            required: false
            hint: "Where the second hero button goes. Defaults to the Contact page."

          - label: "Value Paragraph"
            name: value_paragraph
            widget: markdown
            hint: "A paragraph below the hero that explains your value and what you offer. Plain writing is best. Skip the sales language."

          - label: "Coverage Section Label"
            name: regions_label
            widget: string
            hint: "Small uppercase label above the coverage headline (e.g., Coverage)."

          - label: "Coverage Headline"
            name: regions_headline
            widget: string
            hint: "Headline for the coverage map section (e.g., Where We Work)."

          - label: "Coverage Intro"
            name: regions_note
            widget: text
            hint: "Sentence below the headline explaining how to use the map. This is also where you say you take work nationwide."

          - label: "Map Legend: Worked"
            name: regions_legend_worked
            widget: string
            hint: "Label for shaded states on the map (e.g., Project experience)."

          - label: "Map Legend: Available"
            name: regions_legend_available
            widget: string
            hint: "Label for unshaded states on the map (e.g., Available nationwide)."

          - label: "Map Caption"
            name: regions_hint
            widget: string
            hint: "Rarely seen: shown under the map only while the page is still loading or if a browser has scripts turned off, after which the name of the selected region takes its place. Avoid counts here."

          - label: "Basins & Regions"
            name: regions
            widget: list
            summary: "{{name}}"
            hint: "Each entry becomes a tab beside the map. Selecting it highlights that basin's states. Add as many as you like. No count appears anywhere on the site, so this list can grow as your coverage does."
            fields:
              - label: "Basin / Region Name"
                name: name
                widget: string
                hint: "e.g., Appalachian Basin"

              - label: "ID"
                name: id
                widget: string
                pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers, and hyphens only."]
                hint: "A short lowercase name used internally to link the tab to the map (e.g., appalachian). No spaces or capitals."

              - label: "States"
                name: states
                widget: select
                multiple: true
                hint: "The states this basin covers. These are what light up on the map when the tab is selected. Pick from the list so the map always matches."
                options:
                  - "Alabama"
                  - "Arizona"
                  - "Arkansas"
                  - "California"
                  - "Colorado"
                  - "Connecticut"
                  - "Delaware"
                  - "Florida"
                  - "Georgia"
                  - "Idaho"
                  - "Illinois"
                  - "Indiana"
                  - "Iowa"
                  - "Kansas"
                  - "Kentucky"
                  - "Louisiana"
                  - "Maine"
                  - "Maryland"
                  - "Massachusetts"
                  - "Michigan"
                  - "Minnesota"
                  - "Mississippi"
                  - "Missouri"
                  - "Montana"
                  - "Nebraska"
                  - "Nevada"
                  - "New Hampshire"
                  - "New Jersey"
                  - "New Mexico"
                  - "New York"
                  - "North Carolina"
                  - "North Dakota"
                  - "Ohio"
                  - "Oklahoma"
                  - "Oregon"
                  - "Pennsylvania"
                  - "Rhode Island"
                  - "South Carolina"
                  - "South Dakota"
                  - "Tennessee"
                  - "Texas"
                  - "Utah"
                  - "Vermont"
                  - "Virginia"
                  - "Washington"
                  - "West Virginia"
                  - "Wisconsin"
                  - "Wyoming"

              - label: "Summary"
                name: summary
                widget: text
                hint: "A short paragraph about working in this basin: what makes the land work here distinctive."

              - label: "Plays & Formations"
                name: plays
                widget: list
                summary: "{{name}}"
                hint: "The plays worked in this basin. Each shows with its definition in the panel beside the map."
                fields:
                  - label: "Play / Formation Name"
                    name: name
                    widget: string
                    hint: "e.g., Marcellus Shale"
                  - label: "One-Line Definition"
                    name: definition
                    widget: text
                    hint: "A plain-language sentence explaining what this play is and where it sits. Written for clients who are not landmen."

          - label: "Services Section Label"
            name: services_label
            widget: string
            hint: "Small uppercase label above the services headline (e.g., What We Do)."

          - label: "Services Section Headline"
            name: services_headline
            widget: string
            hint: "Headline for the services section on the home page (e.g., Land Services)."

          - label: "Services Section Intro"
            name: services_intro
            widget: text
            hint: "A sentence or two below the services headline, before the service cards."

          - label: "Link Under the Service Cards"
            name: services_link_text
            widget: string
            required: false
            hint: "The link to the Services page under the cards. Blank shows \"See what each service covers\"."

          - label: "Figures Under the Hero"
            name: stats
            widget: list
            summary: "{{value}} {{label}}"
            required: false
            hint: "The band below the hero. Two entries read best here, each with a line saying what it means. Only put figures here you can stand behind. Empty this list to hide the band."
            fields:
              - label: "Figure"
                name: value
                widget: string
                hint: "Keep it short, for example 25+ or CPL."
              - label: "Label"
                name: label
                widget: string
              - label: "What it means"
                name: detail
                widget: text
                required: false
                hint: "One line saying what the figure means, for example what the credential is. Leave blank to show just the figure and label."

          - label: "Testimonials Section Label"
            name: testimonials_label
            widget: string

          - label: "Testimonials Section Headline"
            name: testimonials_headline
            widget: string

          - label: "Testimonials"
            name: testimonials
            widget: list
            required: false
            summary: "{{attribution}}"
            hint: "Client quotes for the home page. Attribution can be a role rather than a name, for example \"Operator, East Texas\". The section stays hidden until you add one."
            fields:
              - label: "Quote"
                name: quote
                widget: text
              - label: "Attribution"
                name: attribution
                widget: string
                required: false
                hint: "Who said it. A role and region is enough."

          - label: "Sample Work Band"
            name: sample_feature
            widget: object
            required: false
            hint: "The band that points at the sample file on the home page. Leave the headline blank to hide the band."
            fields:
              - { label: "Small Label", name: label, widget: string, required: false }
              - { label: "Headline", name: headline, widget: string, required: false }
              - { label: "Text", name: text, widget: text }
              - { label: "Button Text", name: button, widget: string }

          - label: "Closing Call to Action"
            name: cta
            widget: object
            hint: "The band at the bottom of the home page. Each page has its own. Vary the wording so they do not all read the same."
            fields:
              - label: "Headline"
                name: headline
                widget: string
              - label: "Text"
                name: text
                widget: text
                required: false
              - label: "Button Text"
                name: button
                widget: string
              - label: "Background Image"
                name: image
                widget: image
                required: false
                hint: "Optional photo behind the closing band on the home page. A dark green tint is laid over any new photo so the white text stays readable; wide landscape photos work best. Upload replacements under a new file name. Leave blank for solid green."

      - name: about
        label: "About Page"
        file: src/data/pages/about.json
        format: json
        fields:
          - label: "Page Heading"
            name: page_heading
            widget: string
            required: false
            hint: "The large heading in the green band at the top of the page. Blank shows \"About\"."

          - label: "Page Subtitle"
            name: page_subtitle
            widget: text
            hint: "The line under the page title in the green band at the top of the About page."

          - label: "Google Title (browser tab)"
            name: page_title
            widget: string
            maxlength: 40
            hint: "The browser tab title and the headline in Google results. \"| Petro Land Ventures\" is added to the end automatically, so this can be short. The counter stops at 40 characters."

          - label: "Google Description"
            name: meta_description
            widget: text
            maxlength: 160
            hint: "The sentence shown under this page's title in Google results. The counter stops at 160 characters, about what Google shows."

          - label: "Introduction"
            name: intro
            widget: markdown
            hint: "Your full professional biography. This is the main text on the About page."

          - label: "Approach / Philosophy Headline"
            name: approach_headline
            widget: string
            hint: "Headline for your working approach section (e.g., How I Work)."

          - label: "Approach / Philosophy"
            name: approach
            widget: markdown
            hint: "Describe your working philosophy, approach to projects, and what clients can expect."

          - label: "Team Section Label"
            name: team_label
            widget: string
            hint: "Small uppercase label above the people on this page."

          - label: "Team Section Headline"
            name: team_headline
            widget: string

          - label: "Background Label"
            name: background_label
            widget: string
            required: false
            hint: "The small heading above a person's Work & Experience Details, when they have any. Blank shows \"Background\"."

          - label: "Company Credentials Heading"
            name: credentials_heading
            widget: string
            required: false
            hint: "The small heading above the company credentials below. Blank shows \"Credentials\"."

          - label: "Company Credentials"
            name: credentials
            widget: list
            required: false
            hint: "Licences or registrations that belong to the company, shown as tags near the bottom of the page. A person's own CPL goes on their card instead: open Team / People and edit that person. Leave empty to hide this row."
            fields:
              - label: "Credential Name"
                name: name
                widget: string
                hint: "e.g., Registered in Pennsylvania"
              - label: "Issuing Organization"
                name: issuer
                widget: string
                required: false
              - label: "Year"
                name: year
                widget: string
                required: false
                pattern: ['^([0-9]{4})?$', "A four-digit year, e.g. 2005"]
                hint: "e.g., 2005. Leave blank to leave it off."
              - label: "Number"
                name: number
                widget: string
                required: false
                hint: "A licence or registration number. Leave blank to leave it off."

          - label: "Affiliations Heading"
            name: affiliations_heading
            widget: string
            required: false
            hint: "The small heading above the memberships below. Blank shows \"Affiliations\"."

          - label: "Affiliations & Memberships"
            name: affiliations
            widget: list
            hint: "Professional associations and industry memberships."
            fields:
              - label: "Organization Name"
                name: name
                widget: string
              - label: "Website (optional)"
                name: url
                widget: string
                required: false
                pattern: ['^(https?://.+)?$', "Paste the full address, starting with https://"]
                hint: "e.g., https://www.landman.org. Leave blank if you do not want a link."

          - label: "Closing Call to Action"
            name: cta
            widget: object
            hint: "The band at the bottom of the About page."
            fields:
              - label: "Headline"
                name: headline
                widget: string
              - label: "Text"
                name: text
                widget: text
                required: false
              - label: "Button Text"
                name: button
                widget: string

      - name: experience
        label: "Experience Page"
        file: src/data/pages/experience.json
        format: json
        fields:
          - label: "Page Heading"
            name: page_heading
            widget: string
            required: false
            hint: "The large heading in the green band at the top of the page. Blank shows \"Experience\"."

          - label: "Page Subtitle"
            name: page_subtitle
            widget: text
            hint: "The line under the page title in the green band at the top of the Experience page."

          - label: "Google Title (browser tab)"
            name: page_title
            widget: string
            maxlength: 40
            hint: "The browser tab title and the headline in Google results. \"| Petro Land Ventures\" is added to the end automatically, so this can be short. The counter stops at 40 characters."

          - label: "Google Description"
            name: meta_description
            widget: text
            maxlength: 160
            hint: "The sentence shown under this page's title in Google results. The counter stops at 160 characters, about what Google shows."

          - label: "Introduction"
            name: intro
            widget: markdown
            hint: "Opening paragraph(s) for the Experience page. Describe your regional background and depth of experience."

          - label: "Where We've Worked: Note"
            name: states_note
            widget: text
            hint: "Sentence under the heading. Use it to make clear the list is past experience, not a limit on where you take work."

          - label: "Where We've Worked"
            name: states_served
            widget: list
            hint: "States and basins where you have active experience. Each entry appears as a highlighted card. No count is shown anywhere, so this list can grow freely."
            fields:
              - label: "State"
                name: state
                widget: string
                hint: "e.g., Texas"
              - label: "Basins / Plays / Notes"
                name: note
                widget: string
                hint: "e.g., Permian Basin, Eagle Ford, Haynesville"

          - label: "Where We've Worked: Line Under the Cards"
            name: states_aside
            widget: markdown
            required: false
            hint: "A short line under the state cards. It can include a link, e.g. to the home page coverage map. Leave blank to hide it."

          - label: "Project Types"
            name: project_types
            widget: list
            hint: "Types of projects you have completed. Shown as a bulleted list."
            fields:
              - label: "Project Type"
                name: label
                widget: string
                hint: "e.g., Greenfield leasing programs"

          - label: "Sample Work Band"
            name: sample_feature
            widget: object
            required: false
            hint: "The band that points at the sample file on the Experience page. Leave the headline blank to hide the band."
            fields:
              - { label: "Small Label", name: label, widget: string, required: false }
              - { label: "Headline", name: headline, widget: string, required: false }
              - { label: "Text", name: text, widget: text }
              - { label: "Button Text", name: button, widget: string }

          - label: "Testimonials"
            name: testimonials
            widget: list
            required: false
            hint: "Optional client testimonials. Leave this empty if you prefer not to show them. The section will be hidden automatically."
            fields:
              - label: "Quote"
                name: quote
                widget: text
                hint: "The client's words. Do not include quotation marks. They are added automatically."
              - label: "Client Name"
                name: attribution_name
                widget: string
                hint: "e.g., Jane Doe"
              - label: "Client Title / Company"
                name: attribution_title
                widget: string
                hint: "e.g., Land Manager, XYZ Energy"

          - label: "Where We've Worked: Label"
            name: states_label
            widget: string
            hint: "Small uppercase label above the states section (e.g., Track Record)."

          - label: "Where We've Worked: Headline"
            name: states_headline
            widget: string

          - label: "Project Types: Label"
            name: project_types_label
            widget: string
            hint: "Small uppercase label above the project types section (e.g., Scope)."

          - label: "Project Types: Headline"
            name: project_types_headline
            widget: string

          - label: "Testimonials: Label"
            name: testimonials_label
            widget: string
            hint: "Only shown when at least one testimonial is added below."

          - label: "Testimonials: Headline"
            name: testimonials_headline
            widget: string

          - label: "Selected Projects Label"
            name: projects_label
            widget: string

          - label: "Selected Projects Headline"
            name: projects_headline
            widget: string

          - label: "Selected Projects"
            name: projects
            widget: list
            required: false
            summary: "{{region}}: {{type}}"
            hint: "Individual pieces of work worth showing. Say only what you are comfortable making public, and leave client names out unless you have permission. The section stays hidden until you add one."
            fields:
              - label: "Play or Region"
                name: region
                widget: string
                hint: "For example Haynesville Shale, or Northwest Louisiana."
              - label: "Project Type"
                name: type
                widget: string
                hint: "For example Multi-county title examination."
              - label: "Scope"
                name: scope
                widget: text
                hint: "What the work involved, in a sentence or two."
              - label: "Outcome"
                name: outcome
                widget: text
