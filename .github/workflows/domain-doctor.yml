name: Domain Doctor

# Diagnoses (and optionally repairs) the plvinc.com custom domain, which has been
# serving a stale origin while plvinc.pages.dev updates correctly.
on:
  workflow_dispatch:
    inputs:
      attach_domains:
        description: "Attach plvinc.com / www to the Pages project if missing"
        type: boolean
        default: false
      purge_cache:
        description: "Purge the plvinc.com zone cache"
        type: boolean
        default: false
      fix_dns:
        description: "Swap apex/www to CNAME -> plvinc.pages.dev (proxied). The actual DNS fix."
        type: boolean
        default: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT: 5332b557606637e7f7315510283aba46
      PROJECT: plvinc
      TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # .result.id identifies WHICH dashboard token this secret holds. It is an identifier,
      # not a credential — the token value itself is never printed. Match it against the id
      # in the URL when you open a token from the API Tokens list.
      - name: Token scope check
        run: |
          curl -sS "$CF_API/user/tokens/verify" -H "Authorization: Bearer $TOKEN" \
            | jq '{ok:.success, token_id:.result.id, status:.result.status, errors:[.errors[]?.message]}'

      - name: Pages project state
        run: |
          curl -sS "$CF_API/accounts/$ACCOUNT/pages/projects/$PROJECT" \
            -H "Authorization: Bearer $TOKEN" \
          | jq '{ok:.success,
                 errors:[.errors[]?.message],
                 production_branch:.result.production_branch,
                 domains:.result.domains,
                 latest_prod_deploy:.result.canonical_deployment.url,
                 latest_prod_created:.result.canonical_deployment.created_on,
                 latest_any_deploy:.result.latest_deployment.url,
                 latest_any_env:.result.latest_deployment.environment}'

      - name: Custom domain status
        run: |
          curl -sS "$CF_API/accounts/$ACCOUNT/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $TOKEN" \
          | jq '{ok:.success, errors:[.errors[]?.message],
                 domains:[.result[]? | {name, status, verification_status: .validation_data.status}]}'

      - name: Zone lookup
        id: zone
        run: |
          Z=$(curl -sS "$CF_API/zones?name=plvinc.com" -H "Authorization: Bearer $TOKEN")
          echo "$Z" | jq '{ok:.success, errors:[.errors[]?.message],
                           zones:[.result[]? | {id, name, status, paused}]}'
          echo "id=$(echo "$Z" | jq -r '.result[0].id // empty')" >> "$GITHUB_OUTPUT"

      - name: Zone DNS records for apex and www
        if: steps.zone.outputs.id != ''
        run: |
          curl -sS "$CF_API/zones/${{ steps.zone.outputs.id }}/dns_records" \
            -H "Authorization: Bearer $TOKEN" \
          | jq '{ok:.success, errors:[.errors[]?.message],
                 records:[.result[]? | select(.name|test("^(www\\.)?plvinc\\.com$")) | {name, type, content, proxied}]}'

      - name: Cache rules on the zone
        if: steps.zone.outputs.id != ''
        run: |
          curl -sS "$CF_API/zones/${{ steps.zone.outputs.id }}/rulesets?phase=http_request_cache_settings" \
            -H "Authorization: Bearer $TOKEN" \
          | jq '{ok:.success, errors:[.errors[]?.message],
                 rulesets:[.result[]? | {name, phase, kind}]}'

      - name: Attach custom domains
        if: inputs.attach_domains
        run: |
          for d in plvinc.com www.plvinc.com; do
            echo "--- attaching $d"
            curl -sS -X POST "$CF_API/accounts/$ACCOUNT/pages/projects/$PROJECT/domains" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data "{\"name\":\"$d\"}" \
            | jq '{ok:.success, errors:[.errors[]?.message], name:.result.name, status:.result.status}'
          done

      # The actual fix. Apex and www are proxied AAAA records pointing at 100:: (the IPv6
      # discard prefix) — a black-hole origin, so Cloudflare serves a frozen cached copy of
      # an old build. Repointing them at the Pages project also clears the two custom
      # domains stuck at status: pending.
      - name: Point apex and www at the Pages project
        if: inputs.fix_dns && steps.zone.outputs.id != ''
        run: |
          Z=${{ steps.zone.outputs.id }}
          RECS=$(curl -sS "$CF_API/zones/$Z/dns_records?per_page=100" -H "Authorization: Bearer $TOKEN")
          echo "$RECS" | jq -e '.success' >/dev/null \
            || { echo "Cannot read DNS records — token needs Zone:DNS:Edit on this zone."; exit 1; }

          for NAME in plvinc.com www.plvinc.com; do
            echo "--- $NAME"
            ID=$(echo "$RECS" | jq -r --arg n "$NAME" \
              '.result[] | select(.name==$n and (.type=="A" or .type=="AAAA" or .type=="CNAME")) | .id' | head -1)
            BODY=$(jq -nc --arg n "$NAME" \
              '{type:"CNAME", name:$n, content:"plvinc.pages.dev", proxied:true, ttl:1,
                comment:"Cloudflare Pages project plvinc"}')
            if [ -n "$ID" ]; then
              curl -sS -X PUT "$CF_API/zones/$Z/dns_records/$ID" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "$BODY"
            else
              curl -sS -X POST "$CF_API/zones/$Z/dns_records" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "$BODY"
            fi \
            | jq '{ok:.success, errors:[.errors[]?.message],
                   type:.result.type, name:.result.name, content:.result.content, proxied:.result.proxied}'
          done

          echo "--- mail records left untouched:"
          echo "$RECS" | jq -r \
            '.result[] | select(.type=="MX" or (.type=="TXT" and (.content|test("spf|DMARC")))) | "\(.type) \(.name)"'

      - name: Purge zone cache
        if: inputs.purge_cache && steps.zone.outputs.id != ''
        run: |
          curl -sS -X POST "$CF_API/zones/${{ steps.zone.outputs.id }}/purge_cache" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
          | jq '{ok:.success, errors:[.errors[]?.message]}'
