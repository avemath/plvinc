name: Domain Doctor

# Diagnoses (and optionally repairs) the plvinc.com custom domain, which has been
# serving a stale origin while plvinc.pages.dev updates correctly.
on:
  workflow_dispatch:
    inputs:
      attach_domains:
        description: "Attach plvinc.com / www to the Pages project if missing"
        type: boolean
        default: false
      purge_cache:
        description: "Purge the plvinc.com zone cache"
        type: boolean
        default: false
      cutover:
        description: "Release plvinc.com / www from the leftover plvinc Worker and hand them to Pages."
        type: boolean
        default: false
      delete_stale_worker:
        description: "Delete the leftover plvinc Worker script. One-time cleanup."
        type: boolean
        default: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT: 5332b557606637e7f7315510283aba46
      PROJECT: plvinc
      TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # .result.id identifies WHICH dashboard token this secret holds. It is an identifier,
      # not a credential — the token value itself is never printed. Match it against the id
      # in the URL when you open a token from the API Tokens list.
      - name: Token scope check
        run: |
          curl -sS "$CF_API/user/tokens/verify" -H "Authorization: Bearer $TOKEN" \
            | jq '{ok:.success, token_id:.result.id, status:.result.status, errors:[.errors[]?.message]}'

      - name: Pages project state
        run: |
          curl -sS "$CF_API/accounts/$ACCOUNT/pages/projects/$PROJECT" \
            -H "Authorization: Bearer $TOKEN" \
          | jq '{ok:.success,
                 errors:[.errors[]?.message],
                 production_branch:.result.production_branch,
                 domains:.result.domains,
                 latest_prod_deploy:.result.canonical_deployment.url,
                 latest_prod_created:.result.canonical_deployment.created_on,
                 latest_any_deploy:.result.latest_deployment.url,
                 latest_any_env:.result.latest_deployment.environment}'

      - name: Custom domain status
        run: |
          curl -sS "$CF_API/accounts/$ACCOUNT/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $TOKEN" \
          | jq '{ok:.success, errors:[.errors[]?.message],
                 domains:[.result[]? | {name, status, verification_status: .validation_data.status}]}'

      - name: Zone lookup
        id: zone
        run: |
          Z=$(curl -sS "$CF_API/zones?name=plvinc.com" -H "Authorization: Bearer $TOKEN")
          echo "$Z" | jq '{ok:.success, errors:[.errors[]?.message],
                           zones:[.result[]? | {id, name, status, paused}]}'
          echo "id=$(echo "$Z" | jq -r '.result[0].id // empty')" >> "$GITHUB_OUTPUT"

      - name: Zone DNS records for apex and www
        if: steps.zone.outputs.id != ''
        run: |
          curl -sS "$CF_API/zones/${{ steps.zone.outputs.id }}/dns_records" \
            -H "Authorization: Bearer $TOKEN" \
          | jq '{ok:.success, errors:[.errors[]?.message],
                 records:[.result[]? | select(.name|test("^(www\\.)?plvinc\\.com$")) | {name, type, content, proxied}]}'

      - name: Cache rules on the zone
        if: steps.zone.outputs.id != ''
        run: |
          curl -sS "$CF_API/zones/${{ steps.zone.outputs.id }}/rulesets?phase=http_request_cache_settings" \
            -H "Authorization: Bearer $TOKEN" \
          | jq '{ok:.success, errors:[.errors[]?.message],
                 rulesets:[.result[]? | {name, phase, kind}]}'

      - name: Attach custom domains
        if: inputs.attach_domains
        run: |
          for d in plvinc.com www.plvinc.com; do
            echo "--- attaching $d"
            curl -sS -X POST "$CF_API/accounts/$ACCOUNT/pages/projects/$PROJECT/domains" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data "{\"name\":\"$d\"}" \
            | jq '{ok:.success, errors:[.errors[]?.message], name:.result.name, status:.result.status}'
          done

      # The actual fix. Two resources are both named "plvinc": this Pages project, and a
      # leftover Worker with static assets last deployed 2026-06-08. The Worker holds
      # plvinc.com and www.plvinc.com as Worker Custom Domains, so it — not DNS, and not the
      # cache — is what serves the stale June build. It is also why the Pages custom domains
      # never left status: pending: the hostnames were already claimed.
      #
      # The AAAA 100:: records in the DNS tab are Cloudflare's own bookkeeping for those
      # bindings ("Selection unavailable" in the dashboard) and disappear with them. Nothing
      # here touches DNS records, so no Zone:DNS permission is required — only
      # Workers Scripts:Edit, which this token already has.
      - name: Release the hostnames from the Worker and hand them to Pages
        if: inputs.cutover
        run: |
          DOMS=$(curl -sS "$CF_API/accounts/$ACCOUNT/workers/domains" -H "Authorization: Bearer $TOKEN")
          echo "$DOMS" | jq -e '.success' >/dev/null \
            || { echo "Cannot list Worker Custom Domains — token needs Workers Scripts:Edit."; exit 1; }

          echo "### Releasing hostnames from the '$PROJECT' Worker"
          for H in plvinc.com www.plvinc.com; do
            ID=$(echo "$DOMS" | jq -r --arg h "$H" \
              '.result[] | select(.hostname==$h and .service=="plvinc") | .id')
            if [ -z "$ID" ]; then
              echo "--- $H: not bound to the Worker, nothing to release"
              continue
            fi
            printf -- "--- %s: deleting Worker Custom Domain %s ... " "$H" "$ID"
            CODE=$(curl -sS -o /tmp/del.json -w '%{http_code}' -X DELETE \
              "$CF_API/accounts/$ACCOUNT/workers/domains/$ID" -H "Authorization: Bearer $TOKEN")
            echo "HTTP $CODE"
            [ -s /tmp/del.json ] && jq '{errors:[.errors[]?.message]}' /tmp/del.json 2>/dev/null || true
            case "$CODE" in 2*) ;; *) echo "FAILED to release $H"; exit 1;; esac
          done

          # Re-add each Pages domain so validation restarts against the now-free hostname;
          # they have been sitting at pending since 2026-09-18 and will not retry on their own.
          echo "### Re-triggering Pages custom domain validation"
          for D in plvinc.com www.plvinc.com; do
            curl -sS -o /dev/null -w "--- $D: detach HTTP %{http_code}\n" -X DELETE \
              "$CF_API/accounts/$ACCOUNT/pages/projects/$PROJECT/domains/$D" -H "Authorization: Bearer $TOKEN"
            curl -sS -X POST "$CF_API/accounts/$ACCOUNT/pages/projects/$PROJECT/domains" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "{\"name\":\"$D\"}" \
            | jq '{ok:.success, errors:[.errors[]?.message], name:.result.name, status:.result.status}'
          done

          echo "### Worker Custom Domains remaining (sveltia-cms-auth must survive)"
          curl -sS "$CF_API/accounts/$ACCOUNT/workers/domains" -H "Authorization: Bearer $TOKEN" \
          | jq '[.result[]? | {hostname, service}]'

      # The Worker still has workers.dev enabled, so the stale June build stays publicly
      # reachable until the script itself is removed. It is a different object from the Pages
      # project despite sharing the name: the Worker was created 2026-06-05, the Pages project
      # 2026-06-08. Both guards below must pass before anything is deleted.
      - name: Delete the leftover plvinc Worker script
        if: inputs.delete_stale_worker
        run: |
          DOMS=$(curl -sS "$CF_API/accounts/$ACCOUNT/workers/domains" -H "Authorization: Bearer $TOKEN")
          echo "$DOMS" | jq -e '.success' >/dev/null || { echo "Cannot list Worker Custom Domains."; exit 1; }
          BOUND=$(echo "$DOMS" | jq '[.result[]? | select(.service=="plvinc")] | length')
          [ "$BOUND" = "0" ] \
            || { echo "Refusing: the Worker still holds $BOUND hostname(s). Run cutover first."; exit 1; }

          P=$(curl -sS "$CF_API/accounts/$ACCOUNT/pages/projects/$PROJECT" -H "Authorization: Bearer $TOKEN")
          echo "$P" | jq -e '.success and (.result.name == "plvinc")' >/dev/null \
            || { echo "Refusing: cannot confirm the Pages project is healthy."; exit 1; }
          echo "Pages project intact, serving: $(echo "$P" | jq -c '.result.domains')"

          printf 'Deleting Worker script plvinc ... '
          CODE=$(curl -sS -o /tmp/w.json -w '%{http_code}' -X DELETE \
            "$CF_API/accounts/$ACCOUNT/workers/scripts/plvinc" -H "Authorization: Bearer $TOKEN")
          echo "HTTP $CODE"
          [ -s /tmp/w.json ] && jq '{errors:[.errors[]?.message]}' /tmp/w.json 2>/dev/null || true
          case "$CODE" in 2*) ;; *) echo "FAILED"; exit 1;; esac

          echo "### Remaining Worker scripts — sveltia-cms-auth must still be here:"
          curl -sS "$CF_API/accounts/$ACCOUNT/workers/scripts" -H "Authorization: Bearer $TOKEN" \
            | jq -c '[.result[]?.id]'
          echo "### Pages project after deletion:"
          curl -sS "$CF_API/accounts/$ACCOUNT/pages/projects/$PROJECT" -H "Authorization: Bearer $TOKEN" \
            | jq '{ok:.success, name:.result.name, domains:.result.domains}'

      # Tolerated: the token may not carry Zone:Cache Purge, and a failed purge should not
      # mask a successful cutover.
      - name: Purge zone cache
        continue-on-error: true
        if: inputs.purge_cache && steps.zone.outputs.id != ''
        run: |
          curl -sS -X POST "$CF_API/zones/${{ steps.zone.outputs.id }}/purge_cache" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
          | jq '{ok:.success, errors:[.errors[]?.message]}'
